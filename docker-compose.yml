services:
  postgres:
    image: postgres:17-alpine
    container_name: LottoPilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lottopilot}
      POSTGRES_USER: ${POSTGRES_USER:-lottopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    volumes:
      - lottopilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lottopilot

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lottopilot:local
    container_name: LottoPilot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lottopilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lottopilot}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HOST_PORT:-8088}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - lottopilot

networks:
  lottopilot:
    name: lottopilot

volumes:
  lottopilot_pgdata:
    name: lottopilot_pgdata
