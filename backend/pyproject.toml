[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lottopilot"
version = "0.1.0"
description = "LottoPilot backend: lottery analysis, recommendation, AI explanation and backtesting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "LottoPilot Contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=44.0.0",
  "apscheduler>=3.10.4",
  "orjson>=3.10.12",
  "python-dateutil>=2.9.0.post0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-python-dateutil>=2.9.0.20241003",
  "httpx>=0.28.0",
]

[project.scripts]
lottopilot = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# Keep CI focused on real defects; style can be tightened later.
select = ["E", "F", "B", "ASYNC"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
packages = ["app"]
plugins = []
mypy_path = "."
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "argon2.*"]
ignore_missing_imports = true
