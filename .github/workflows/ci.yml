name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  offline-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structure check
        run: python scripts/check_structure.py
      - name: Offline acceptance
        run: python scripts/offline_acceptance.py
      - name: Offline unit suite
        run: python scripts/run_unit_offline.py
      - name: Compose static validation
        run: python scripts/validate_compose_static.py

  backend:
    needs: [offline-acceptance]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest -q

  frontend:
    needs: [offline-acceptance]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lottopilot:ci .
