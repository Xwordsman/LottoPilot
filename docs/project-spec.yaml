project:
  display_name: LottoPilot
  repository_name: LottoPilot
  python_package: lottopilot
  docker_image: ghcr.io/OWNER/lottopilot
  docker_services:
    - lottopilot
    - lottopilot-postgres
  project_identifier_rule: "产品标识统一使用 LottoPilot；技术包和镜像使用 lottopilot"
  purpose: "历史开奖分析、候选号码生成、AI辅助解释与滚动回测"
  language: zh-CN

stack:
  backend:
    language: Python
    version: "3.12"
    package_manager: uv
    framework: FastAPI
    orm: SQLAlchemy 2.x
    migrations: Alembic
    validation: Pydantic 2.x
    uuid_library: uuid6
    http_client: httpx
    scheduler: APScheduler
  frontend:
    language: TypeScript
    node_version: "22 LTS"
    package_manager: npm
    framework: React 19
    router: React Router 7
    bundler: Vite
    styling: Tailwind CSS 4
    components: shadcn/ui-style local components
    charts: ECharts
    state: TanStack Query + Zustand
  database:
    production: PostgreSQL 17
    local: PostgreSQL 17
    integration_tests: PostgreSQL 17
    primary_key: UUID v7
  deployment:
    image_build: Docker Buildx
    registry: GitHub Container Registry
    orchestration: Docker Compose
    reverse_proxy: Baota panel or host Nginx/Caddy

runtime:
  app_container_name: LottoPilot
  database_container_name: LottoPilot-postgres
  app_internal_port: 8000
  app_host_port: 8088
  database_port: 5432
  scheduler_mode: single_instance
  redis_required: false
  frontend_delivery: "frontend dist copied into backend image and served by FastAPI"

lotteries:
  ssq:
    display_name: 双色球
    source_org: 中国福利彩票发行管理中心
    source_homepage: https://www.cwl.gov.cn/
    red:
      min: 1
      max: 33
      count: 6
    blue:
      min: 1
      max: 16
      count: 1
    draw_weekdays: [2, 4, 7]
  dlt:
    display_name: 大乐透
    source_org: 中国体育彩票
    source_homepage: https://www.sporttery.cn/
    front:
      min: 1
      max: 35
      count: 5
    back:
      min: 1
      max: 12
      count: 2
    official_game_no: "85"
    draw_weekdays: [1, 3, 6]

recommendation:
  output_ticket_count: 5
  default_seed_policy: "hash(lottery_type + target_issue + profile_version)"
  candidate_pool_default: 50000
  ai_rerank_enabled_by_default: true
  ai_max_rerank_weight: 0.10
  score_label: 模型评分
  probability_claim: "所有合法单注的理论中奖概率相同；评分只用于候选排序"

ai:
  protocol: OpenAI-compatible
  key_storage: encrypted_at_rest
  supported_provider_examples: [OpenAI, DeepSeek, 通义千问, SiliconFlow, NewAPI, Ollama]
  required_settings: [base_url, api_key, model]
  failure_behavior: "保留统计引擎结果并记录 AI 调用状态"

data:
  primary_sources: [official_api, official_detail_page]
  fallback: csv_or_xlsx_manual_import
  default_sync_policy: "low_frequency_poll_with_backoff"
  preserve_raw_payload: true
  idempotency_key: "lottery_type + issue"

quality:
  backend_test_command: uv run pytest
  frontend_test_command: npm run test
  frontend_build_command: npm run build
  required_checks: [format, lint, typecheck, unit_test, integration_test, docker_smoke_test]
